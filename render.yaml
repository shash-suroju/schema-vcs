services:
  - type: web
    name: schema-vcs
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: CATALOG_DSN
        fromDatabase:
          name: schema-vcs-catalog
          property: connectionString
      - key: APP_ENV
        value: render

databases:
  - name: schema-vcs-catalog
    plan: free
    databaseName: catalog
    user: svcs